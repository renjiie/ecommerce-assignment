previews:
  generation: off

databases:
  - name: ecommerce-orders-db
    databaseName: orders
    user: orders
    plan: free
    region: oregon
    ipAllowList: []

services:
  - type: web
    name: ecommerce-orders-api
    runtime: docker
    plan: free
    region: oregon
    dockerContext: backend
    dockerfilePath: backend/Dockerfile
    healthCheckPath: /health
    preDeployCommand: alembic upgrade head
    envVars:
      - key: ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: AUTH_BYPASS
        value: "false"
      - key: REVIEWER_ROLE_SWITCH_ENABLED
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: ecommerce-orders-db
          property: connectionString
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: CLERK_AUTHORIZED_PARTIES
        sync: false
