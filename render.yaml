previews:
  generation: off

databases:
  - name: ecommerce-orders-db
    databaseName: orders
    user: orders
    plan: basic-256mb
    region: oregon
    ipAllowList: []

services:
  - type: keyvalue
    name: ecommerce-orders-redis
    plan: starter
    region: oregon
    ipAllowList: []

  - type: web
    name: ecommerce-orders-api
    runtime: docker
    plan: starter
    region: oregon
    dockerContext: backend
    dockerfilePath: backend/Dockerfile
    healthCheckPath: /health
    preDeployCommand: alembic upgrade head
    envVars:
      - key: ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: AUTH_BYPASS
        value: "false"
      - key: REVIEWER_ROLE_SWITCH_ENABLED
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: ecommerce-orders-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: ecommerce-orders-redis
          property: connectionString
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: CLERK_AUTHORIZED_PARTIES
        sync: false

  - type: worker
    name: ecommerce-orders-worker
    runtime: docker
    plan: starter
    region: oregon
    dockerContext: backend
    dockerfilePath: backend/Dockerfile
    dockerCommand: celery -A app.workers.celery_app.celery_app worker --loglevel=info
    envVars:
      - key: ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: AUTH_BYPASS
        value: "false"
      - key: REVIEWER_ROLE_SWITCH_ENABLED
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: ecommerce-orders-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: ecommerce-orders-redis
          property: connectionString
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: CLERK_AUTHORIZED_PARTIES
        sync: false

  - type: worker
    name: ecommerce-orders-beat
    runtime: docker
    plan: starter
    region: oregon
    dockerContext: backend
    dockerfilePath: backend/Dockerfile
    dockerCommand: celery -A app.workers.celery_app.celery_app beat --loglevel=info
    envVars:
      - key: ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: AUTH_BYPASS
        value: "false"
      - key: REVIEWER_ROLE_SWITCH_ENABLED
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: ecommerce-orders-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: ecommerce-orders-redis
          property: connectionString
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: CLERK_AUTHORIZED_PARTIES
        sync: false
